name: CI

on:
  pull_request:
  push:
    branches: [main, blueprint-contracts]

# A new push to a PR supersedes the old run — don't burn a runner on the stale one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: tests (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS too: the mod runs there, with BSD tools and a symlinked /tmp.
        os: [ubuntu-latest, macos-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Mod files parse
        run: for f in mods/walkthrough/*.js mods/walkthrough/lib/*.js; do node --check "$f" || exit 1; done
      - name: Mod manifest and keys are JSON
        run: node -e "for (const f of ['mods/walkthrough/mod.json', 'keys.json']) JSON.parse(require('fs').readFileSync(f, 'utf8'))"
      # The git tests make throwaway repositories in a temporary folder.
      - name: Test
        run: npm test
